{% extends "base.html" %}

{% block title %}Регистрация - KeyManager{% endblock %}

{% block content %}
<div class="flex min-h-[calc(100vh-16rem)] items-center justify-center">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/20">
                    <i data-lucide="user-plus" class="w-8 h-8 text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 mb-2">Создать аккаунт</h1>
                <p class="text-slate-500 text-sm">Зарегистрируйтесь для управления API ключами</p>
            </div>

            <form method="POST" action="/api/register" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-2">Имя пользователя</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                        </div>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200 text-slate-800 placeholder-slate-400"
                            placeholder="Введите имя пользователя"
                            required
                            minlength="3"
                            maxlength="50"
                        >
                    </div>
                    <p class="mt-1.5 text-xs text-slate-400">Минимум 3 символа</p>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Пароль</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
                        </div>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200 text-slate-800 placeholder-slate-400"
                            placeholder="Введите пароль"
                            required
                            minlength="6"
                        >
                    </div>
                    <p class="mt-1.5 text-xs text-slate-400">Минимум 6 символов</p>
                </div>

                <button type="submit" class="w-full flex items-center justify-center gap-2 px-6 py-3.5 text-base font-semibold text-white bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 rounded-xl shadow-lg shadow-indigo-500/25 hover:shadow-xl hover:shadow-indigo-500/30 transition-all duration-200 transform hover:-translate-y-0.5">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                    Зарегистрироваться
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-slate-500">
                    Уже есть аккаунт?
                    <a href="/api/login" class="font-medium text-indigo-600 hover:text-indigo-700 transition-colors">Войти</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
